<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet" />
</head>

<body>
  <main>
    <header>
      <h2>Messages</h2>
    </header>

    <div style="" id="message-list" class="messages"></div>

    <div class="input-container">
      <form id="input-form">
        <input id="username" name="username" type="text" placeholder="Name" />
        <input id="colour" name="colour" type="text" placeholder="Colour" />
        <input id="message-input" class="message-box" name="message" type="text" placeholder="Type a message" />
        <button type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
          </svg>
        </button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
